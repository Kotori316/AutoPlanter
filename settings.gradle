pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "Sponge Snapshots"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
        maven {
            name = "Kotori316 Plugin"
            url = "https://maven.kotori316.com/"
        }
        maven {
            name = "ModPublishPlugin"
            url = "https://maven.modmuss50.me/"
        }
    }
}

plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version("1.0.0")
}

include("common")
if (!Boolean.parseBoolean(System.getenv("DISABLE_FORGE"))) {
    include("forge")
}
if (!Boolean.parseBoolean(System.getenv("DISABLE_FABRIC"))) {
    include("fabric")
}
if (!Boolean.parseBoolean(System.getenv("DISABLE_NEOFORGE"))) {
    include("neoforge")
}
