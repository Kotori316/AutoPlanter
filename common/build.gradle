plugins {
    id "java"
    id "org.spongepowered.gradle.vanilla" version "0.3.0"
}

archivesBaseName = "${project.baseName}-Common-${project.minecraftVersion}"

minecraft {
    version(project.minecraftVersion)
}

dependencies {
    compileOnly(group: "org.spongepowered", name: "mixin", version: "0.8.7")
    implementation(group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2")
}
